[package]
name = "dsec-orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "DSec worker container: durable journaled agent rollouts, idempotent tool calls, branch-safe subagents, and the OpenAI-compatible model bridge"

[dependencies]
dsec-protocol = { workspace = true }
dsec-rl = { workspace = true }
dsec-agentenv = { workspace = true }
dsec-sdk = { workspace = true }
dsec-control = { workspace = true }
dsec-runtime = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
# OpenAI-compatible mock model server (axum) for tests and examples.
server = ["dep:axum"]

[dependencies.axum]
workspace = true
optional = true

[dev-dependencies]
tempfile = "3"

[[example]]
name = "phase1_task"
required-features = ["server"]

[[example]]
name = "phase2_crash_recovery"
required-features = ["server"]

[[example]]
name = "phase3_subagents"
required-features = ["server"]
