thiserror = { workspace = true }
# Hardware-accelerated CRC-32 (IEEE 802.3): PCLMULQDQ folding on x86-64,
# slice-by-8 fallback elsewhere. Same polynomial/results as the previous
# hand-rolled table, 8-30x faster on large payloads.
crc32fast = "1"
