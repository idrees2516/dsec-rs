[package]
name = "dsec-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Benchmark suite: sandbox creation rate (paper target ~5k/s), 100k burst simulation, pause/resume latency, RL steps/sec vs PufferLib, pack_diff savings, placement throughput, HTTP RPS, protocol codec throughput"
readme = "README.md"
keywords = ["benchmark", "sandbox", "load-testing", "performance", "rl"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "dsec-bench"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dsec-protocol = { workspace = true }
dsec-storage = { workspace = true }
dsec-runtime = { workspace = true }
dsec-control = { workspace = true }
dsec-sdk = { workspace = true }
dsec-rl = { workspace = true }
