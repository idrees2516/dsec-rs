name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, 1.85]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace
      - name: Concurrency-sensitive suites (repeat)
        if: matrix.toolchain == 'stable'
        run: cargo test -p dsec-runtime
      - name: Feature-gated suites (agentenv server + parquet)
        if: matrix.toolchain == 'stable'
        run: cargo test -p dsec-agentenv --features server,parquet

  features:
    name: Features (dsec-agentenv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Clippy with all features (warnings are errors)
        run: cargo clippy -p dsec-agentenv --all-targets --features server,parquet -- -D warnings
      - name: Server example smoke
        run: cargo run -p dsec-agentenv --features server --example live_pipeline
      - name: Environment zoo example
        run: cargo run -p dsec-agentenv --example envgen_zoo

  karotte:
    name: Karotte pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Full pipeline example (confinement → mcp → judges → transcript)
        run: cargo run -p dsec-karotte --example full_run
  autoenv:
    name: AutoEnvScaling flywheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Flywheel example (propose → validate → calibrate → train → review)
        run: cargo run -p dsec-autoenv --example flywheel
      - name: Flywheel integration tests
        run: cargo test -p dsec-autoenv --test flywheel

  doc:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  bench-smoke:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Quick benchmark pass (correctness, not perf gate)
        run: cargo run --release -p dsec-bench -- --quick
